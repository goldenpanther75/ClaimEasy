<!DOCTYPE html>
<html lang="en">

<head>
    <script src="auth_guard.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Bike Claim - ClaimEasy</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .track-container {
            max-width: 800px;
            margin: 50px auto;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .timeline {
            position: relative;
            margin-top: 40px;
            padding-left: 30px;
            display: none;
        }

        .timeline-item {
            position: relative;
            padding-bottom: 30px;
            border-left: 2px solid #ddd;
            padding-left: 20px;
        }

        .timeline-item:last-child {
            border-left: none;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: -9px;
            top: 0;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #ddd;
        }

        .timeline-item.active::before {
            background: #ff5722;
            /* Bike Orange */
        }

        .timeline-item.active .timeline-title {
            color: #ff5722;
        }

        .status-form {
            text-align: center;
            margin-bottom: 30px;
        }

        .track-btn {
            background: #ff5722;
            color: white;
            padding: 10px 30px;
            border: none;
            border-radius: 5px;
            margin-top: 10px;
            cursor: pointer;
        }
    </style>
</head>

<body class="bg-light">

    <header class="header">
        <div class="container header-container">
            <a href="bike_easyclaim.html" class="logo-text">
                Claim<span class="highlight">Easy</span>
            </a>
            <a href="index.html" class="btn btn-outline" style="padding: 8px 16px;">Back to Home</a>
        </div>
    </header>

    <div class="track-container">
        <div class="status-form">
            <h2><i class="fas fa-motorcycle"></i> Track Bike Claim</h2>
            <p>Enter your Bike Number / Claim Number.</p>
            <input type="text" id="claimRef" placeholder="e.g. MH-01-AB-1234"
                style="padding: 10px; width: 60%; margin-top: 15px; border: 1px solid #ddd; border-radius: 5px;">
            <br>
            <button class="track-btn" onclick="showStatus()">Track Status</button>
        </div>

        <div class="timeline" id="statusTimeline">
            <div class="timeline-item active">
                <h4 class="timeline-title">Claim Intimated</h4>
                <p class="text-muted">Request received on <span id="date1"></span>.</p>
            </div>
            <div class="timeline-item active">
                <h4 class="timeline-title">Document Verification</h4>
                <p class="text-muted">Images and docs verified.</p>
            </div>
            <div class="timeline-item">
                <h4 class="timeline-title">Approval Pending</h4>
                <p class="text-muted">Awaiting final approval from insurer.</p>
            </div>
            <div class="timeline-item">
                <h4 class="timeline-title">Claim Settlement</h4>
                <p class="text-muted">Payment processed to account.</p>
            </div>
        </div>
    </div>

    <script>
        async function showStatus() {
            const ref = document.getElementById('claimRef').value;
            if (ref.trim() === '') {
                alert('Please enter a valid Bike/Claim Number');
                return;
            }

            const btn = document.querySelector('.track-btn');
            const originalText = btn.innerText;
            btn.innerText = 'Checking...';
            btn.disabled = true;

            try {
                const response = await fetch(`http://13.126.167.8:5000/api/claims/${ref}`);
                const data = await response.json();

                if (response.ok) {
                    // Update date
                    if (data.createdAt) {
                        const d = new Date(data.createdAt);
                        document.getElementById('date1').innerText = d.toLocaleDateString();
                    }

                    // Show Timeline with animation
                    const timeline = document.getElementById('statusTimeline');
                    timeline.style.display = 'block';
                    timeline.style.opacity = 0;
                    let op = 0.1;
                    let timer = setInterval(function () {
                        if (op >= 1) {
                            clearInterval(timer);
                        }
                        timeline.style.opacity = op;
                        timeline.style.filter = 'alpha(opacity=' + op * 100 + ")";
                        op += op * 0.1;
                    }, 10);
                } else {
                    alert('Claim not found. Please check the ID.');
                    document.getElementById('statusTimeline').style.display = 'none';
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error fetching status. Please try again.');
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }
    </script>

<script src="main.js?v=shield_optimized"></script>
<script src="chatbot_widget.js"></script>
</body>

<script src="chatbot_widget.js"></script>
<script src="main.js?v=shield_optimized"></script>
<script src="chatbot_widget.js"></script>
</body>

</html>
