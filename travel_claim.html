<!DOCTYPE html>
<html lang="en">

<head>
    <script src="auth_guard.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Travel Claim - ClaimEasy</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="autofill.js" defer></script>
    <script src="validation.js" defer></script>
    <style>
        .claim-container {
            max-width: 600px;
            margin: 50px auto;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .form-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-header h2 {
            color: #333;
            margin-bottom: 10px;
        }

        .form-header p {
            color: #666;
        }

        .claim-btn {
            background: #00bcd4;
            /* Travel Cyan */
            color: white;
            transition: all 0.3s;
            border: none;
        }

        .claim-btn:hover {
            background: #0097a7;
            transform: translateY(-2px);
        }
    </style>
</head>

<body class="bg-light">

    <header class="header">
        <div class="container header-container">
            <a href="travel_easyclaim.html" class="logo-text">
                Claim<span class="highlight">Easy</span>
            </a>
            <a href="index.html" class="btn btn-outline" style="padding: 8px 16px;">Back to Home</a>
        </div>
    </header>

    <div class="claim-container">
        <div class="form-header">
            <div style="font-size: 3rem; color: #00bcd4; margin-bottom: 15px;"><i class="fas fa-plane-slash"></i></div>
            <h2>File Travel Claim</h2>
            <p>Report travel mishaps, lost baggage, or medical emergencies.</p>
        </div>

        <form id="claim-form">
            <div class="form-group">
                <label for="policyNumber">Policy Number</label>
                <input type="text" id="policyNumber" placeholder="Enter Policy Number" required>
            </div>

            <div class="form-group">
                <label for="claimType">Claim For</label>
                <select id="claimType" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px;">
                    <option value="">Select Claim Type</option>
                    <option value="baggage">Loss/Delay of Baggage</option>
                    <option value="medical">Medical Emergency</option>
                    <option value="cancellation">Trip Cancellation</option>
                    <option value="passport">Loss of Passport</option>
                </select>
            </div>

            <div class="form-group">
                <label for="mobile">Registered Mobile Number</label>
                <input type="tel" id="mobile" placeholder="Mobile Number" required>
            </div>

            <div class="form-group">
                <label for="amount">Estimated Claim Amount (â‚¹)</label>
                <input type="number" id="amount" placeholder="e.g. 25000" required min="1">
            </div>

            <div class="form-group">
                <label for="travelDate">Date of Incident</label>
                <input type="date" id="travelDate" required>
            </div>

            <!-- Documentation Upload Section -->
            <div
                style="background: #f9f9f9; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px dashed #ddd;">
                <h4 style="margin-bottom: 15px; color: #333;">Upload Documents &amp; Photos</h4>

                <div class="form-group">
                    <label style="font-size: 0.9rem;">Boarding Pass / Air Ticket Copy</label>
                    <input type="file" required accept="image/*,.pdf" style="padding: 5px;">
                </div>

                <div class="form-group">
                    <label style="font-size: 0.9rem;">Passport &amp; Visa Copy</label>
                    <input type="file" required accept="image/*,.pdf" style="padding: 5px;">
                </div>

                <div class="form-group">
                    <label style="font-size: 0.9rem;">Medical Reports / Bills (for Medical Emergency)</label>
                    <input type="file" required accept="image/*,.pdf" multiple style="padding: 5px;">
                </div>

                <div class="form-group">
                    <label style="font-size: 0.9rem;">Property Irregularity Report (for Baggage Loss)</label>
                    <input type="file" required accept="image/*,.pdf" style="padding: 5px;">
                </div>
            </div>

            <button type="submit" class="btn btn-block claim-btn" style="font-size: 1.1rem; margin-top: 10px;">Initiate
                Claim</button>
        </form>
    </div>

    <script src="upload_utils.js"></script>
    <script>
        // Check for pre-filled data from Claim Intimation page
        document.addEventListener('DOMContentLoaded', () => {
            const tempClaimDetails = localStorage.getItem('tempClaimDetails');
            if (tempClaimDetails) {
                const details = JSON.parse(tempClaimDetails);
                if (document.getElementById('policyNumber')) document.getElementById('policyNumber').value = details.policyNumber || '';
                if (document.getElementById('mobile')) document.getElementById('mobile').value = details.mobile || '';

                localStorage.removeItem('tempClaimDetails');
            }
        });

        document.getElementById('claim-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            // Indian Standard Format Validation
            const validation = ClaimEasyValidation.validate();
            if (!validation.isValid) {
                ClaimEasyValidation.showAlert(validation);
                return;
            }

            const travelDateStr = document.getElementById('travelDate').value;
            if (travelDateStr) {
                const travelDate = new Date(travelDateStr);
                const today = new Date();
                if (travelDate > today) {
                    alert('Incident date cannot be in the future.');
                    return;
                }
            }

            const btn = e.target.querySelector('button');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Uploading &amp; Submitting...';
            btn.disabled = true;

            try {
                // Upload Files
                const inputs = document.querySelectorAll('input[type="file"]');
                const boardingPassFile = inputs[0].files[0];
                const passportFile = inputs[1].files[0];
                const medicalReportsFiles = inputs[2].files;
                const pirFile = inputs[3].files[0];

                const boardingPassPath = boardingPassFile ? await uploadFile(boardingPassFile) : "Not Uploaded";
                const passportPath = passportFile ? await uploadFile(passportFile) : "Not Uploaded";
                const medicalReportsPaths = await uploadFiles(medicalReportsFiles);
                const pirPath = pirFile ? await uploadFile(pirFile) : "Not Uploaded";

                const formData = {
                    type: 'Travel',
                    policyNumber: document.getElementById('policyNumber').value,
                    amount: document.getElementById('amount').value,
                    claimType: document.getElementById('claimType').value,
                    mobile: document.getElementById('mobile').value,
                    travelDate: document.getElementById('travelDate').value,
                    documents: {
                        boardingPass: boardingPassPath,
                        passport: passportPath,
                        medicalReports: medicalReportsPaths.length > 0 ? medicalReportsPaths : ["Not Uploaded"],
                        pir: pirPath
                    }
                };

                const response = await fetch('http://13.126.167.8:5000/api/claims', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();

                if (response.ok) {
                    alert('Travel Claim Submitted! Claim ID: ' + result.claimId);
                    window.location.href = 'travel_easyclaim.html';
                } else {
                    throw new Error(result.error || 'Submission failed');
                }
            } catch (error) {
                console.error(error);
                alert('Error: ' + error.message);
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });
    </script>

    <script src="main.js?v=shield_optimized"></script>
    <script src="chatbot_widget.js"></script>
</body>

</html>
